<script>
(() => {
    "use strict";

    /* =========================================
       ELEMENTS
    ========================================= */

    const brFile = document.getElementById("brFile");
    const brUpload = document.getElementById("brUpload");
    const brWorkspace = document.getElementById("brWorkspace");

    const brOriginal = document.getElementById("brOriginal");
    const brResultPreview = document.getElementById("brResultPreview");

    const brColor = document.getElementById("brColor");
    const brColorCode = document.getElementById("brColorCode");

    const brTolerance = document.getElementById("brTolerance");
    const brToleranceValue = document.getElementById("brToleranceValue");

    const brRemove = document.getElementById("brRemove");
    const brReset = document.getElementById("brReset");

    const brProcessing = document.getElementById("brProcessing");
    const brResult = document.getElementById("brResult");

    const brDownload = document.getElementById("brDownload");


    /* =========================================
       SETTINGS
    ========================================= */

    const MAX_FILE_SIZE = 100 * 1024 * 1024;
    const MAX_WIDTH = 12000;
    const MAX_HEIGHT = 12000;
    const MAX_PIXELS = 50000000;

    const ALLOWED_TYPES = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    const ALLOWED_EXTENSIONS = [
        "jpg",
        "jpeg",
        "png",
        "webp"
    ];


    /* =========================================
       STATE
    ========================================= */

    let brImage = null;
    let brFileObject = null;

    let brOriginalURL = null;
    let brDownloadURL = null;

    let isProcessing = false;


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(text, type = "info") {

        let box =
            document.getElementById("brMessage");

        if (!box) {

            box = document.createElement("div");

            box.id = "brMessage";

            box.style.marginTop = "15px";
            box.style.padding = "11px 14px";
            box.style.borderRadius = "10px";
            box.style.fontSize = "13px";
            box.style.fontWeight = "600";
            box.style.textAlign = "center";

            brRemove.parentElement.after(box);
        }

        if (type === "error") {

            box.style.background = "#fef2f2";
            box.style.color = "#b91c1c";

        } else if (type === "success") {

            box.style.background = "#ecfdf5";
            box.style.color = "#047857";

        } else {

            box.style.background = "#eff6ff";
            box.style.color = "#1d4ed8";
        }

        box.textContent = text;

        clearTimeout(box.timer);

        box.timer = setTimeout(() => {
            box.textContent = "";
        }, 4000);
    }


    /* =========================================
       FILE SIZE
    ========================================= */

    function formatFileSize(bytes) {

        if (bytes < 1024) {
            return bytes + " B";
        }

        if (bytes < 1024 * 1024) {
            return (bytes / 1024).toFixed(1) + " KB";
        }

        if (bytes < 1024 * 1024 * 1024) {
            return (bytes / (1024 * 1024)).toFixed(2) + " MB";
        }

        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }


    /* =========================================
       FILE EXTENSION
    ========================================= */

    function getExtension(filename) {

        if (!filename) {
            return "";
        }

        const parts =
            filename.toLowerCase().split(".");

        return parts.length > 1
            ? parts.pop()
            : "";
    }


    /* =========================================
       VALIDATE FILE
    ========================================= */

    function validateFile(file) {

        if (!file) {

            showMessage(
                "Please select an image.",
                "error"
            );

            return false;
        }

        const ext =
            getExtension(file.name);

        const validType =
            ALLOWED_TYPES.includes(file.type);

        const validExtension =
            ALLOWED_EXTENSIONS.includes(ext);

        if (!validType && !validExtension) {

            showMessage(
                "Please select a JPG, PNG or WebP image.",
                "error"
            );

            return false;
        }

        if (file.size > MAX_FILE_SIZE) {

            showMessage(
                "Maximum file size is 100 MB.",
                "error"
            );

            return false;
        }

        return true;
    }


    /* =========================================
       RELEASE ORIGINAL URL
    ========================================= */

    function releaseOriginalURL() {

        if (brOriginalURL) {

            URL.revokeObjectURL(
                brOriginalURL
            );

            brOriginalURL = null;
        }
    }


    /* =========================================
       RELEASE DOWNLOAD URL
    ========================================= */

    function releaseDownloadURL() {

        if (brDownloadURL) {

            URL.revokeObjectURL(
                brDownloadURL
            );

            brDownloadURL = null;
        }
    }


    /* =========================================
       UPLOAD
    ========================================= */

    brFile.addEventListener(
        "change",
        () => {

            const file =
                brFile.files &&
                brFile.files.length
                    ? brFile.files[0]
                    : null;

            if (file) {
                loadBackgroundImage(file);
            }
        }
    );


    /* =========================================
       LOAD IMAGE
    ========================================= */

    function loadBackgroundImage(file) {

        if (!validateFile(file)) {
            return;
        }

        releaseOriginalURL();
        releaseDownloadURL();

        brFileObject = file;

        brOriginalURL =
            URL.createObjectURL(file);

        const img =
            new Image();

        img.onload = () => {

            const width =
                img.naturalWidth;

            const height =
                img.naturalHeight;

            if (!width || !height) {

                releaseOriginalURL();

                brFileObject = null;

                showMessage(
                    "Could not read image dimensions.",
                    "error"
                );

                return;
            }

            if (
                width > MAX_WIDTH ||
                height > MAX_HEIGHT
            ) {

                releaseOriginalURL();

                brFileObject = null;

                showMessage(
                    `Maximum dimensions are ${MAX_WIDTH.toLocaleString()} × ${MAX_HEIGHT.toLocaleString()} pixels.`,
                    "error"
                );

                return;
            }

            if (
                width * height >
                MAX_PIXELS
            ) {

                releaseOriginalURL();

                brFileObject = null;

                showMessage(
                    "This image is too large to process safely in your browser.",
                    "error"
                );

                return;
            }

            brImage = img;

            brOriginal.src =
                brOriginalURL;

            brWorkspace.style.display =
                "block";

            brResult.style.display =
                "none";

            brResultPreview.removeAttribute(
                "src"
            );

            showMessage(
                `Image loaded: ${width.toLocaleString()} × ${height.toLocaleString()} px`,
                "success"
            );
        };


        img.onerror = () => {

            brImage = null;
            brFileObject = null;

            releaseOriginalURL();

            showMessage(
                "Could not open this image.",
                "error"
            );
        };


        img.src =
            brOriginalURL;
    }


    /* =========================================
       DRAG & DROP
    ========================================= */

    ["dragenter", "dragover"].forEach(type => {

        brUpload.addEventListener(
            type,
            event => {

                event.preventDefault();
                event.stopPropagation();

                brUpload.classList.add(
                    "dragover"
                );
            }
        );
    });


    ["dragleave", "drop"].forEach(type => {

        brUpload.addEventListener(
            type,
            event => {

                event.preventDefault();
                event.stopPropagation();

                brUpload.classList.remove(
                    "dragover"
                );
            }
        );
    });


    brUpload.addEventListener(
        "drop",
        event => {

            const file =
                event.dataTransfer.files &&
                event.dataTransfer.files.length
                    ? event.dataTransfer.files[0]
                    : null;

            if (file) {
                loadBackgroundImage(file);
            }
        }
    );


    /* =========================================
       COLOR PICKER
    ========================================= */

    brColor.addEventListener(
        "input",
        () => {

            brColorCode.textContent =
                brColor.value.toUpperCase();
        }
    );


    /* =========================================
       TOLERANCE
    ========================================= */

    brTolerance.addEventListener(
        "input",
        () => {

            brToleranceValue.textContent =
                brTolerance.value;
        }
    );


    /* =========================================
       HEX → RGB
    ========================================= */

    function hexToRGB(hex) {

        const clean =
            hex.replace("#", "");

        return {
            r: parseInt(
                clean.substring(0, 2),
                16
            ),

            g: parseInt(
                clean.substring(2, 4),
                16
            ),

            b: parseInt(
                clean.substring(4, 6),
                16
            )
        };
    }


    /* =========================================
       COLOR DISTANCE
    ========================================= */

    function colorDistance(
        r,
        g,
        b,
        target
    ) {

        const dr =
            r - target.r;

        const dg =
            g - target.g;

        const db =
            b - target.b;

        return Math.sqrt(
            dr * dr +
            dg * dg +
            db * db
        );
    }


    /* =========================================
       REMOVE BACKGROUND
    ========================================= */

    brRemove.addEventListener(
        "click",
        () => {

            if (isProcessing) {
                return;
            }

            if (
                !brImage ||
                !brImage.naturalWidth
            ) {

                showMessage(
                    "Please upload an image first.",
                    "error"
                );

                return;
            }

            processBackground();
        }
    );


    /* =========================================
       MAIN PROCESSING
    ========================================= */

    function processBackground() {

        isProcessing = true;

        brRemove.disabled = true;
        brReset.disabled = true;

        brProcessing.style.display =
            "block";

        brResult.style.display =
            "none";


        /*
         * Let browser display spinner first.
         */

        setTimeout(() => {

            try {

                removeBackgroundPixels();

            } catch (error) {

                console.error(
                    "Background remover error:",
                    error
                );

                brProcessing.style.display =
                    "none";

                brRemove.disabled = false;
                brReset.disabled = false;

                isProcessing = false;

                showMessage(
                    "Processing failed. The image may be too large for your browser.",
                    "error"
                );
            }

        }, 50);
    }


    /* =========================================
       PIXEL PROCESSING
       
       IMPORTANT:
       Only background-color pixels connected
       to the edges are removed.
    ========================================= */

    function removeBackgroundPixels() {

        const width =
            brImage.naturalWidth;

        const height =
            brImage.naturalHeight;


        const canvas =
            document.createElement("canvas");

        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );


        if (!ctx) {
            throw new Error(
                "Canvas unavailable"
            );
        }


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /*
         * Draw original image.
         */

        ctx.drawImage(
            brImage,
            0,
            0,
            width,
            height
        );


        /*
         * Read all pixels.
         */

        const imageData =
            ctx.getImageData(
                0,
                0,
                width,
                height
            );


        const pixels =
            imageData.data;


        const target =
            hexToRGB(
                brColor.value
            );


        const tolerance =
            Number(
                brTolerance.value
            );


        /*
         * RGB distance maximum.
         *
         * Maximum RGB Euclidean distance
         * is approximately 441.
         *
         * Convert tolerance 5–100
         * into a useful distance range.
         */

        const maxDistance =
            441.67 *
            (tolerance / 100);


        /*
         * visited:
         *
         * 0 = not checked
         * 1 = checked
         */

        const visited =
            new Uint8Array(
                width * height
            );


        /*
         * Queue for flood fill.
         *
         * Each pixel index is stored.
         */

        const queue =
            new Int32Array(
                width * height
            );


        let queueStart = 0;
        let queueEnd = 0;


        /*
         * Add a pixel to queue
         * only if it matches the selected
         * background color.
         */

        function tryAdd(index) {

            if (
                index < 0 ||
                index >= width * height
            ) {
                return;
            }

            if (visited[index]) {
                return;
            }


            visited[index] = 1;


            const p =
                index * 4;


            const r =
                pixels[p];

            const g =
                pixels[p + 1];

            const b =
                pixels[p + 2];


            const distance =
                colorDistance(
                    r,
                    g,
                    b,
                    target
                );


            if (
                distance <= maxDistance
            ) {

                queue[queueEnd++] =
                    index;

            }
        }


        /*
         * Start from ALL four edges.
         */

        for (let x = 0; x < width; x++) {

            tryAdd(x);

            tryAdd(
                (height - 1) * width + x
            );
        }


        for (let y = 0; y < height; y++) {

            tryAdd(
                y * width
            );

            tryAdd(
                y * width + (width - 1)
            );
        }


        /*
         * Flood fill.
         */

        while (
            queueStart < queueEnd
        ) {

            const index =
                queue[queueStart++];


            const x =
                index % width;


            const y =
                Math.floor(
                    index / width
                );


            /*
             * Make this pixel transparent.
             */

            const p =
                index * 4;

            pixels[p + 3] = 0;


            /*
             * Neighbor: LEFT
             */

            if (x > 0) {

                tryAdd(
                    index - 1
                );
            }


            /*
             * Neighbor: RIGHT
             */

            if (x < width - 1) {

                tryAdd(
                    index + 1
                );
            }


            /*
             * Neighbor: UP
             */

            if (y > 0) {

                tryAdd(
                    index - width
                );
            }


            /*
             * Neighbor: DOWN
             */

            if (y < height - 1) {

                tryAdd(
                    index + width
                );
            }
        }


        /*
         * Put processed pixels back.
         */

        ctx.putImageData(
            imageData,
            0,
            0
        );


        /*
         * Export transparent PNG.
         */

        canvas.toBlob(
            blob => {

                if (!blob) {

                    throwProcessingError();

                    return;
                }


                releaseDownloadURL();


                brDownloadURL =
                    URL.createObjectURL(
                        blob
                    );


                /*
                 * Show result preview.
                 */

                brResultPreview.src =
                    brDownloadURL;


                /*
                 * Download link.
                 */

                brDownload.href =
                    brDownloadURL;


                brDownload.download =
                    getDownloadName();


                /*
                 * Finish UI.
                 */

                brProcessing.style.display =
                    "none";

                brResult.style.display =
                    "block";

                brRemove.disabled =
                    false;

                brReset.disabled =
                    false;

                isProcessing = false;


                showMessage(
                    `Background removed successfully • ${formatFileSize(blob.size)}`,
                    "success"
                );


                setTimeout(() => {

                    brResult.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                }, 150);

            },
            "image/png"
        );
    }


    /* =========================================
       DOWNLOAD NAME
    ========================================= */

    function getDownloadName() {

        if (!brFileObject) {

            return "toolifyhub-background-removed.png";
        }


        let name =
            brFileObject.name
                .replace(/\.[^/.]+$/, "")
                .replace(/[<>:"/\\|?*]+/g, "_")
                .trim();


        if (!name) {
            name = "image";
        }


        return (
            name +
            "-background-removed.png"
        );
    }


    /* =========================================
       PROCESSING ERROR
    ========================================= */

    function throwProcessingError() {

        brProcessing.style.display =
            "none";

        brRemove.disabled = false;
        brReset.disabled = false;

        isProcessing = false;

        showMessage(
            "Could not create the transparent PNG.",
            "error"
        );
    }


    /* =========================================
       RESET
    ========================================= */

    brReset.addEventListener(
        "click",
        resetTool
    );


    function resetTool() {

        isProcessing = false;

        brFile.value = "";

        brImage = null;
        brFileObject = null;


        releaseOriginalURL();
        releaseDownloadURL();


        brWorkspace.style.display =
            "none";

        brResult.style.display =
            "none";

        brProcessing.style.display =
            "none";


        brOriginal.removeAttribute(
            "src"
        );

        brResultPreview.removeAttribute(
            "src"
        );


        /*
         * Reset color.
         */

        brColor.value =
            "#ffffff";

        brColorCode.textContent =
            "#FFFFFF";


        /*
         * Reset tolerance.
         */

        brTolerance.value =
            "30";

        brToleranceValue.textContent =
            "30";


        /*
         * Reset buttons.
         */

        brRemove.disabled =
            false;

        brReset.disabled =
            false;


        brDownload.removeAttribute(
            "href"
        );

        brDownload.removeAttribute(
            "download"
        );


        showMessage(
            "Tool reset."
        );
    }


    /* =========================================
       FAQ
    ========================================= */

    document
        .querySelectorAll(".br-faq-question")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const item =
                        button.parentElement;

                    item.classList.toggle(
                        "active"
                    );
                }
            );
        });


    /* =========================================
       CLEANUP
    ========================================= */

    window.addEventListener(
        "beforeunload",
        () => {

            releaseOriginalURL();
            releaseDownloadURL();
        }
    );

})();
</script>

</body>
</html>
